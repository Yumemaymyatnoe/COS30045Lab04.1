<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - SVG House and Garden</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        svg {
            border: 2px solid #333;
            background-color: #87CEEB; /* Sky background */
        }
    </style>
</head>
<body>

    <svg width="600" height="500" viewBox="0 0 600 500">
        <!-- 1. Grass/Ground (Rectangle) -->
        <rect x="0" y="300" width="600" height="200" fill="#2d8a4e" />

        <!-- 2. Sun (Circle) -->
        <circle cx="500" cy="80" r="40" fill="#FFD700" />

        <!-- 3. Tree (Grouped Ellipse & Rect) -->
        <g id="tree">
            <!-- Tree Trunk -->
            <rect x="70" y="220" width="30" height="100" fill="#8B4513" />
            <!-- Tree Leaves (Ellipse) -->
            <ellipse cx="85" cy="200" rx="45" ry="55" fill="#1b5e20" />
        </g>

        <!-- 4. Path to House (Path with Curves) -->
        <path d="M 230 450 Q 250 380 270 350 T 280 320 L 310 320 L 310 350 Q 280 380 300 450 Z" fill="#DAA520" />

        <!-- 5. House Main Structure -->
        <g id="house">
            <!-- House Body (Rectangle) -->
            <rect x="230" y="200" width="180" height="120" fill="#A0522D" />
            
            <!-- Roof (Path / Polygon shape) -->
            <path d="M 210 200 L 320 100 L 430 200 Z" fill="#8B0000" />
            
            <!-- Door (Rectangle) -->
            <rect x="300" y="250" width="40" height="70" fill="#5c2c16" />
            <!-- Door Knob (Circle) -->
            <circle cx="332" cy="285" r="3" fill="#FFD700" />

            <!-- Windows (Rectangles) -->
            <rect x="250" y="220" width="35" height="35" fill="#E0FFFF" stroke="#333" stroke-width="2" />
            <rect x="355" y="220" width="35" height="35" fill="#E0FFFF" stroke="#333" stroke-width="2" />
        </g>

        <!-- 6. Label Text -->
        <text x="450" y="280" font-family="Arial" font-size="20" font-weight="bold" fill="#333">My SVG House</text>
    </svg>

</body>
</html>
