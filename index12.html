<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background Sky -->
  <rect width="800" height="600" fill="#87CEEB" />

  <!-- Clouds -->
  <g id="clouds" fill="#FFFFFF" opacity="0.9">
    <g transform="translate(40, 20)">
      <path d="M 20 60 A 25 25 0 0 1 50 40 A 35 35 0 0 1 110 30 A 30 30 0 0 1 160 50 A 25 25 0 0 1 180 70 A 20 20 0 0 1 170 90 L 30 90 A 20 20 0 0 1 20 60 Z" />
    </g>
    <g transform="translate(360, 30) scale(0.85)">
      <path d="M 20 60 A 25 25 0 0 1 50 40 A 35 35 0 0 1 110 30 A 30 30 0 0 1 160 50 A 25 25 0 0 1 180 70 A 20 20 0 0 1 170 90 L 30 90 A 20 20 0 0 1 20 60 Z" />
    </g>
  </g>

  <!-- Birds in the Sky -->
  <g id="birds" stroke="#222222" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 270 140 Q 280 125 290 140 Q 300 125 310 140" />
    <path d="M 250 165 Q 260 150 270 165 Q 280 150 290 165" />
    <path d="M 310 180 Q 320 168 330 180 Q 340 168 350 180" />
  </g>

  <!-- Sun with Rays -->
  <g id="sun" transform="translate(600, 20) scale(0.7)">
    <polygon points="100,10 112,35 137,17 137,45 163,37 153,63 182,68 163,89 189,105 163,119 180,140 152,142 160,169 133,158 132,187 110,168 100,195 89,168 67,187 66,158 39,169 47,142 19,140 36,119 10,105 36,89 17,68 46,63 36,37 62,45 62,17 87,35" fill="#F5A623" />

  </g>

  <!-- Ground / Grass -->
  <rect x="0" y="380" width="800" height="130" fill="#2d8a4e" />

  <!-- Trees -->
  <g id="tree-1" transform="translate(10, 150) scale(0.85)">
    <rect x="90" y="220" width="20" height="60" fill="#6D4C41" rx="2" />
    <path d="M 100 120 L 25 180 L 60 175 L 15 230 L 100 230 Z" fill="#2E7D32" />
    <path d="M 100 120 L 175 180 L 140 175 L 185 230 L 100 230 Z" fill="#1B5E20" />
    <path d="M 100 60 L 35 125 L 65 120 L 30 170 L 100 170 Z" fill="#388E3C" />
    <path d="M 100 60 L 165 125 L 135 120 L 170 170 L 100 170 Z" fill="#2E7D32" />
    <path d="M 100 10 L 45 80 L 70 75 L 45 120 L 100 120 Z" fill="#4CAF50" />
    <path d="M 100 10 L 155 80 L 130 75 L 155 120 L 100 120 Z" fill="#388E3C" />
  </g>

  <g id="tree-2" transform="translate(110, 215) scale(0.6)">
    <rect x="90" y="220" width="20" height="60" fill="#6D4C41" rx="2" />
    <path d="M 100 120 L 25 180 L 60 175 L 15 230 L 100 230 Z" fill="#2E7D32" />
    <path d="M 100 120 L 175 180 L 140 175 L 185 230 L 100 230 Z" fill="#1B5E20" />
    <path d="M 100 60 L 35 125 L 65 120 L 30 170 L 100 170 Z" fill="#388E3C" />
    <path d="M 100 60 L 165 125 L 135 120 L 170 170 L 100 170 Z" fill="#2E7D32" />
    <path d="M 100 10 L 45 80 L 70 75 L 45 120 L 100 120 Z" fill="#4CAF50" />
    <path d="M 100 10 L 155 80 L 130 75 L 155 120 L 100 120 Z" fill="#388E3C" />
  </g>

  <!-- Wooden Fence -->
  <g id="wooden-fence" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1">
    <!-- Horizontal Bars -->
    <rect x="180" y="380" width="160" height="6" rx="2" />
    <rect x="180" y="398" width="160" height="6" rx="2" />
    <rect x="580" y="380" width="160" height="6" rx="2" />
    <rect x="580" y="398" width="160" height="6" rx="2" />
    
    <!-- Vertical Pickets Left -->
    <path d="M 190 415 L 190 370 L 195 363 L 200 370 L 200 415 Z" />
    <path d="M 220 415 L 220 370 L 225 363 L 230 370 L 230 415 Z" />
    <path d="M 250 415 L 250 370 L 255 363 L 260 370 L 260 415 Z" />
    <path d="M 280 415 L 280 370 L 285 363 L 290 370 L 290 415 Z" />
    <path d="M 310 415 L 310 370 L 315 363 L 320 370 L 320 415 Z" />

    <!-- Vertical Pickets Right -->
    <path d="M 590 415 L 590 370 L 595 363 L 600 370 L 600 415 Z" />
    <path d="M 620 415 L 620 370 L 625 363 L 630 370 L 630 415 Z" />
    <path d="M 650 415 L 650 370 L 655 363 L 660 370 L 660 415 Z" />
    <path d="M 680 415 L 680 370 L 685 363 L 690 370 L 690 415 Z" />
    <path d="M 710 415 L 710 370 L 715 363 L 720 370 L 720 415 Z" />
  </g>

  <!-- Pathway to Main Road -->
  <polygon points="445,400 495,400 520,510 395,510" fill="#DAA520" />

  <!-- Flower Beds -->
  <g id="flower-beds">
    <!-- Left Flower Bed -->
    <g transform="translate(370, 400)">
      <path d="M 5 15 L 5 0 M 20 15 L 20 -5 M 35 15 L 35 2" stroke="#2E7D32" stroke-width="2" />
      <circle cx="5" cy="0" r="6" fill="#FF4081" />
      <circle cx="5" cy="0" r="2" fill="#FFEB3B" />
      <circle cx="20" cy="-5" r="7" fill="#E040FB" />
      <circle cx="20" cy="-5" r="2.5" fill="#FFEB3B" />
      <circle cx="35" cy="2" r="6" fill="#FF5252" />
      <circle cx="35" cy="2" r="2" fill="#FFEB3B" />
    </g>

    <!-- Right Flower Bed -->
    <g transform="translate(495, 400)">
      <path d="M 10 15 L 10 2 M 25 15 L 25 -4 M 40 15 L 40 1" stroke="#2E7D32" stroke-width="2" />
      <circle cx="10" cy="2" r="6" fill="#FF9800" />
      <circle cx="10" cy="2" r="2" fill="#FFFFFF" />
      <circle cx="25" cy="-4" r="7" fill="#FF4081" />
      <circle cx="25" cy="-4" r="2.5" fill="#FFEB3B" />
      <circle cx="40" cy="1" r="6" fill="#7C4DFF" />
      <circle cx="40" cy="1" r="2" fill="#FFEB3B" />
    </g>
  </g>

  <!-- House Structure -->
  <g id="house">
    <rect x="360" y="260" width="220" height="140" fill="#A0522D" stroke="#5c2c16" stroke-width="2" />
    <path d="M 330 260 L 470 140 L 610 260 Z" fill="#8B0000" stroke="#5c2c16" stroke-width="2" />
    <rect x="445" y="320" width="50" height="80" fill="#5c2c16" />
    <circle cx="488" cy="362" r="4" fill="#FFD000" />

    <rect x="385" y="285" width="40" height="40" fill="#E0FFFF" stroke="#333" stroke-width="2" />
    <line x1="405" y1="285" x2="405" y2="325" stroke="#333" stroke-width="1.5" />
    <line x1="385" y1="305" x2="425" y2="305" stroke="#333" stroke-width="1.5" />

    <rect x="515" y="285" width="40" height="40" fill="#E0FFFF" stroke="#333" stroke-width="2" />
    <line x1="535" y1="285" x2="535" y2="325" stroke="#333" stroke-width="1.5" />
    <line x1="515" y1="305" x2="555" y2="305" stroke="#333" stroke-width="1.5" />
  </g>

  <!-- Bus Stop Sign -->
  <g id="bus-stop" transform="translate(365, 385)">
    <rect x="18" y="40" width="6" height="85" fill="#555555" />
    <circle cx="21" cy="25" r="22" fill="#E53935" />
    <circle cx="21" cy="25" r="17" fill="#FFFFFF" />
    <text x="21" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">BUS</text>
    <text x="21" y="31" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#E53935" text-anchor="middle">STOP</text>
  </g>

  <!-- Mailbox -->
  <g id="mailbox" transform="translate(530, 445)">
    <rect x="-10" y="30" width="4" height="35" fill="#424242" />
    <path d="M -22 15 L -2 15 Q 3 15 3 22 L 3 30 L -22 30 Z" fill="#D32F2F" />
    <rect x="-18" y="20" width="4" height="6" fill="#FFEB3B" />
  </g>

  <!-- Playful Dog (Shifted to the left, standing naturally on grass between house and car) -->
  <g id="dog" transform="translate(548, 455) scale(0.8)">
    <path d="M -5 10 Q -15 0 -8 -5" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none" />
    <ellipse cx="10" cy="15" rx="18" ry="12" fill="#A1887F" />
    <rect x="-2" y="22" width="5" height="14" rx="2" fill="#8D6E63" />
    <rect x="8" y="22" width="5" height="14" rx="2" fill="#8D6E63" />
    <rect x="18" y="22" width="5" height="14" rx="2" fill="#8D6E63" />
    <circle cx="28" cy="2" r="11" fill="#A1887F" />
    <path d="M 23 -4 Q 18 5 22 10" stroke="#5D4037" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="31" cy="0" r="1.5" fill="#000" />
    <circle cx="37" cy="4" r="2.5" fill="#000" />
  </g>

  <!-- Street Lamp (Custom designed according to reference image) -->
  <g id="street-lamp" transform="translate(700, 350)">
    <!-- Shadow Base -->
    <ellipse cx="15" cy="172" rx="16" ry="4" fill="#1b2426" opacity="0.2" />
    
    <!-- Base Pedestal (Wider trapezoid bottom) -->
    <path d="M 2 170 L 28 170 L 25 130 L 5 130 Z" fill="#2d2a2a" />
    <rect x="0" y="166" width="30" height="4" fill="#211f1f" rx="1" />
    
    <!-- Middle Joint / Ring -->
    <circle cx="15" cy="122" r="5" fill="#2d2a2a" />
    <rect x="11" y="127" width="8" height="3" fill="#211f1f" />
    
    <!-- Main Vertical Pole -->
    <rect x="12" y="20" width="6" height="100" fill="#2d2a2a" />
    <rect x="10" y="17" width="10" height="3" fill="#211f1f" />
    
    <!-- Curved Arm Cap -->
    <path d="M 15 17 Q 15 5 35 5 L 60 5" stroke="#2d2a2a" stroke-width="4" fill="none" stroke-linecap="round" />
    
    <!-- Lamp Head / Shade -->
    <path d="M 52 5 C 52 2 78 2 82 12 L 50 12 Z" fill="#2d2a2a" />
    
    <!-- Light Bulb (Warm Yellow Glow) -->
    <path d="M 54 12 Q 66 18 76 12 Z" fill="#FCE89B" />
    <ellipse cx="65" cy="12" rx="10" ry="3" fill="#FFF59D" />
  </g>

  <!-- Butterflies -->
  <g id="butterflies">
    <g transform="translate(550, 380) scale(0.7)">
      <path d="M 0 0 Q -10 -12 0 -18 Q 10 -12 0 0" fill="#FF4081" />
      <path d="M 0 0 Q 12 -10 18 0 Q 12 10 0 0" fill="#FF80AB" />
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#000" stroke-width="1" />
    </g>
    <g transform="translate(560, 365) scale(0.6) rotate(-20)">
      <path d="M 0 0 Q -10 -12 0 -18 Q 10 -12 0 0" fill="#00E5FF" />
      <path d="M 0 0 Q 12 -10 18 0 Q 12 10 0 0" fill="#80D8FF" />
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#000" stroke-width="1" />
    </g>
  </g>

  <!-- Label Text -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">My House</text>

  <!-- Main White Road at Bottom -->
  <g id="road">
    <rect x="0" y="510" width="800" height="90" fill="#EAEAEA" stroke="#D0D0D0" stroke-width="2" />
    <line x1="0" y1="555" x2="800" y2="555" stroke="#A0A0A0" stroke-width="3" stroke-dasharray="20,15" />
  </g>

  <!-- School Bus -->
  <g id="school-bus" transform="translate(-20, 395) scale(1.45)">
    <rect x="10" y="20" width="220" height="80" rx="10" fill="#FFC107" stroke="#FFA000" stroke-width="2" />
    <path d="M 230 50 L 260 50 Q 270 50 270 65 L 270 100 L 230 100 Z" fill="#FFC107" stroke="#FFA000" stroke-width="2" />
    
    <rect x="25" y="30" width="30" height="30" fill="#E0F7FA" stroke="#333" stroke-width="1.5" rx="3" />
    <rect x="65" y="30" width="30" height="30" fill="#E0F7FA" stroke="#333" stroke-width="1.5" rx="3" />
    <rect x="105" y="30" width="30" height="30" fill="#E0F7FA" stroke="#333" stroke-width="1.5" rx="3" />
    <rect x="145" y="30" width="30" height="30" fill="#E0F7FA" stroke="#333" stroke-width="1.5" rx="3" />
    <rect x="185" y="30" width="35" height="30" fill="#E0F7FA" stroke="#333" stroke-width="1.5" rx="3" />
    <path d="M 230 30 L 255 50 L 230 50 Z" fill="#E0F7FA" stroke="#333" stroke-width="1.5" />

    <line x1="10" y1="70" x2="230" y2="70" stroke="#333333" stroke-width="4" />

    <text x="115" y="85" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">SCHOOL BUS</text>

    <g transform="translate(60, 100)">
      <circle cx="0" cy="0" r="18" fill="#212121" />
      <circle cx="0" cy="0" r="8" fill="#B0BEC5" />
    </g>
    <g transform="translate(200, 100)">
      <circle cx="0" cy="0" r="18" fill="#212121" />
      <circle cx="0" cy="0" r="8" fill="#B0BEC5" />
    </g>

    <rect x="268" y="85" width="8" height="15" rx="2" fill="#424242" />
    <circle cx="265" cy="72" r="5" fill="#FFEB3B" />
  </g>

  <!-- Blue Car -->
  <g id="car" transform="translate(560, 460) scale(1.15)">
    <path d="M 10 35 L 25 35 L 45 15 L 115 15 L 135 35 L 175 35 Q 185 35 185 45 L 185 65 Q 185 75 175 75 L 10 75 Q 0 75 0 65 L 0 45 Q 0 35 10 35 Z" fill="#1E88E5" stroke="#1565C0" stroke-width="2" />
    
    <path d="M 48 20 L 80 20 L 80 35 L 32 35 Z" fill="#E0F7FA" stroke="#1565C0" stroke-width="1.5" />
    <path d="M 85 20 L 112 20 L 127 35 L 85 35 Z" fill="#E0F7FA" stroke="#1565C0" stroke-width="1.5" />

    <g transform="translate(35, 75)">
      <circle cx="0" cy="0" r="18" fill="#333333" />
      <circle cx="0" cy="0" r="8" fill="#B0BEC5" />
    </g>
    <g transform="translate(140, 75)">
      <circle cx="0" cy="0" r="18" fill="#333333" />
      <circle cx="0" cy="0" r="8" fill="#B0BEC5" />
    </g>

    <rect x="175" y="42" width="8" height="12" rx="3" fill="#FFEB3B" />
  </g>
</svg>
